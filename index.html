<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bill Tracker</h1>

        <form id="bill-form">
            <div class="order-details">
                <div class="field">
                    <label for="order-date">Date</label>
                    <input type="date" id="order-date" required>
                </div>
                <div class="field">
                    <label for="store-name">Store Name</label>
                    <input type="text" id="store-name" placeholder="e.g. Big Bazaar" required>
                </div>
                <div class="field">
                    <label for="order-id">Order ID</label>
                    <input type="text" id="order-id" placeholder="e.g. ORD-1234" required>
                </div>
            </div>

            <h2>Items</h2>
            <table id="items-table">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Rate</th>
                        <th>Amount</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="items-body">
                    <!-- item rows are added here by script.js -->
                </tbody>
            </table>

            <div class="items-actions">
                <button type="button" id="add-item-btn">+ Add Item</button>
                <div class="total">Total: <span id="grand-total">0.00</span></div>
            </div>

            <div class="submit-actions">
                <button type="submit" id="submit-btn">Submit Bill</button>
            </div>

            <p id="status-message"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
